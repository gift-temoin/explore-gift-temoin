<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .background { fill: #ffffff; }
      .heart1 { fill: #0ea5e9; }
      .heart2 { fill: #ec4899; }
    }
    @media (prefers-color-scheme: dark) {
      .background { fill: #1a1a1a; }
      .heart1 { fill: #0ea5e9; }
      .heart2 { fill: #ec4899; }
    }
  </style>
  <g clip-path="url(#clip0_hearts)">
    <rect class="background" width="180" height="180" rx="37" />
    <g transform="translate(90, 90) scale(1.4)">
      <!-- Left heart (rotated -45 degrees) -->
      <g transform="rotate(-45)">
        <path class="heart1"
          d="M 0,-25 C -12,-35 -35,-35 -35,-12 C -35,0 -24,12 0,30 C 24,12 35,0 35,-12 C 35,-35 12,-35 0,-25 Z" 
          opacity="0.85"/>
      </g>
      <!-- Right heart (rotated 45 degrees) -->
      <g transform="rotate(45)">
        <path class="heart2"
          d="M 0,-25 C -12,-35 -35,-35 -35,-12 C -35,0 -24,12 0,30 C 24,12 35,0 35,-12 C 35,-35 12,-35 0,-25 Z" 
          opacity="0.85"/>
      </g>
    </g>
  </g>
  <defs>
    <clipPath id="clip0_hearts">
      <rect width="180" height="180" fill="white" />
    </clipPath>
  </defs>
</svg>